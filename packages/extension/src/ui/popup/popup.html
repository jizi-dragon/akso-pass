<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="pop">
      <header class="brand">
        <!-- ★ v4.2.1：这里原先也是 `brand-ring`（CSS 画的锥形渐变环，不是品牌标识）。
             改用真实 Akso logo —— 与 `parallel.html` / `translate.html` 的侧栏同一个文件。
             ★ 三个页面都要用同一份，别再各画一个形状（这一处我一轮前正是漏了）。 -->
        <img class="brand-logo" src="../../assets/Icon48.png" alt="" aria-hidden="true" />
        <div class="brand-text">
          <h1>Akso Pass</h1>
          <p>多账号并行 · 纯浏览器隔离</p>
        </div>
        <span class="ver" id="ext-version">v—</span>
      </header>

      <!-- 云端身份区：未登录显示「登录」，已登录显示账号 → 点开是操作菜单 -->
      <section id="identity" class="identity hidden">
        <button id="identity-btn" class="identity-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="identity-avatar" class="identity-av" aria-hidden="true">·</span>
          <span class="identity-text">
            <b id="identity-name">未登录</b>
            <i id="identity-sub">点击登录云端账号库</i>
          </span>
          <span class="identity-caret" aria-hidden="true">▾</span>
        </button>
        <div id="identity-menu" class="identity-menu hidden" role="menu">
          <button id="menu-sync" class="identity-item" type="button" role="menuitem">
            <b>同步数据</b>
            <i>从云端重新拉取账号与站点</i>
          </button>
          <button id="menu-logout" class="identity-item danger" type="button" role="menuitem">
            <b>退出账号</b>
            <i>清除本机缓存的账号数据</i>
          </button>
        </div>
      </section>

      <section class="stats">
        <div class="stat">
          <b id="stat-accounts">—</b>
          <span>账号</span>
        </div>
        <i class="divider"></i>
        <div class="stat stat-online">
          <b id="stat-online">—</b>
          <span>在线</span>
        </div>
        <i class="divider"></i>
        <div class="stat">
          <b id="stat-sites">—</b>
          <span>授权站点</span>
        </div>
      </section>

      <button id="open-parallel" class="launch" type="button">
        <span class="launch-ico" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <rect x="1.5" y="1.5" width="6" height="6" rx="1.8" fill="currentColor" opacity=".9" />
            <rect x="8.5" y="1.5" width="6" height="6" rx="1.8" fill="currentColor" opacity=".55" />
            <rect x="1.5" y="8.5" width="6" height="6" rx="1.8" fill="currentColor" opacity=".55" />
            <rect x="8.5" y="8.5" width="6" height="6" rx="1.8" fill="currentColor" opacity=".9" />
          </svg>
        </span>
        <span class="launch-text">
          <!-- ★ v4.2.1：按用户要求"打开并行管理页" → **"打开管理页"**
               （那一页现在同时承载账号中心与翻译面板，叫"并行"已经不准确）。 -->
          <b>打开管理页</b>
          <i>账号中心 · 翻译面板 · 站点授权</i>
        </span>
        <span class="launch-arrow" aria-hidden="true">→</span>
      </button>

      <button id="open-vault" class="launch secondary hidden" type="button">
        <span class="launch-text">
          <b>登录</b>
          <i>登录云端账号库 · 跨设备同步站点与账号</i>
        </span>
        <span class="launch-arrow" aria-hidden="true">↗</span>
      </button>

      <footer class="foot">
        <span><kbd>Alt+Q</kbd> 呼出账号轮盘</span>
        <i></i>
        <span>轮盘内点击扇区即可切换</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
